name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tag must point to a commit on main" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build Windows x64 artifacts
        run: |
          docker build \
            --build-arg AVIUTL2_AI_AGENT_BUILD_COMMIT="$GITHUB_SHA" \
            --output type=local,dest=dist .

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          archive="aviutl2-ai-agent-${GITHUB_REF_NAME}-windows-x64.zip"
          mkdir release-package
          cp dist/aviutl2-agent-plugin.aux2 release-package/
          cp dist/aviutl2-agent.exe release-package/
          cp dist/aviutl2-agent-mcp.exe release-package/
          cp dist/SHA256SUMS LICENSE README.md release-package/
          (cd release-package && zip -9 "../$archive" ./*)
          sha256sum "$archive" > "$archive.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="aviutl2-ai-agent-${GITHUB_REF_NAME}-windows-x64.zip"
          gh release create "$GITHUB_REF_NAME" \
            "$archive" "$archive.sha256" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
