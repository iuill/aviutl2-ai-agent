[workspace]
members = ["crates/protocol", "crates/plugin", "crates/cli", "crates/mcp"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.98"
# aviutl2 0.41.0's generic module refers to filter pixel/audio types, so the
# filter feature is required even though this crate does not register a filter.
aviutl2 = { version = "=0.41.0", default-features = false, features = ["generic", "filter"] }
clap = { version = "4.5.41", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
rmcp = { version = "=3.0.1", default-features = false, features = ["macros", "server", "transport-io"] }
tokio = { version = "1.47.1", features = ["io-std", "macros", "rt"] }
ureq = { version = "3.0.12", default-features = false, features = ["json"] }
png = "0.17.16"
base64 = "0.22.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
