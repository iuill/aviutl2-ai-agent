[workspace]
members = ["crates/protocol", "crates/plugin", "crates/cli", "crates/mcp"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.104"
# aviutl2 0.41.0's generic module refers to filter pixel/audio types, so the
# filter feature is required even though this crate does not register a filter.
aviutl2 = { version = "=0.41.0", default-features = false, features = ["generic", "filter"] }
clap = { version = "4.6.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
rmcp = { version = "=3.1.0", default-features = false, features = ["macros", "server", "transport-io"] }
tokio = { version = "1.53.1", features = ["io-std", "macros", "rt"] }
ureq = { version = "3.3.0", default-features = false, features = ["json"] }
png = "0.18.1"
base64 = "0.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
